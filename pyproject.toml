[project]
name = "survey-runs"
version = "0.1.0"
description = "Year-over-year and repeatability analysis of road-survey runs, on a synthetic survey program with known ground truth"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Eric West" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyproj>=3.6",
    "requests>=2.31",
    "scipy>=1.13",
    "shapely>=2.1",
]

[project.scripts]
survey-runs = "survey_runs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey_runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
