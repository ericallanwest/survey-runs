# The project page: docs/ as committed (docs/data is built locally by `survey-runs site`),
# plus the repeatability lab exported to WebAssembly here. Skipped while the repo is private.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Build the wheel the lab installs
        run: uv build --wheel -o notebooks/public
      - name: Export the lab
        run: |
          uv run marimo export html-wasm notebooks/lab.py -o docs/lab --mode run
          rm -f docs/lab/CLAUDE.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
